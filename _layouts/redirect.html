<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <title>Redirecting…</title>
</head>
<body>
    <p>This article has moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to }}</a>.</p>
    <script>
        (function () {
            var target = {{ page.redirect_to | relative_url | jsonify }};
            window.location.replace(target + window.location.search + window.location.hash);
        }());
    </script>
</body>
</html>
