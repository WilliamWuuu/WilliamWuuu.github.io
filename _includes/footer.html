{% assign lang = page.lang | default: "en" %}
{% assign t = site.data.i18n[lang] %}
<footer class="footer border-top py-2 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>{{ t.footer.last_updated }} {% if lang == "zh-CN" %}{{ "now" | date: "%Y年%-m月" }}{% else %}{{ "now" | date: "%b %Y" }}{% endif %}</i>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>
