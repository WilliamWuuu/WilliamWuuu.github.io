{% for tag in include.tags -%}
    {% assign tag_slug = tag | slugify -%}
    {% capture tag_path %}/blogs/tags/{{ tag_slug }}/{% endcapture -%}
    <a class="badge badge-light blog-tag-link" href="{{ tag_path | relative_url }}" title="{{ site.data.ui.blogs.view_tag | replace: '%s', tag | escape }}">{{ tag }}</a>{% unless forloop.last %} {% endunless %}
{% endfor -%}
