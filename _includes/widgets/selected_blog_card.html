{% assign blogs = include.blogs %}
{% assign t = site.data.ui %}
{% assign blogs_url = "/blogs" %}

<div class="my-3 p-0 bg-white shadow-sm rounded-xl">
    <h6 class="border-bottom border-gray p-3 mb-0">
        <i class="fas fa-pen-nib"></i> {{ t.homepage.selected_blogs }}
        <a href="{{ blogs_url | relative_url }}">({{ t.blogs.view_all }} <i class="fas fa-angle-double-right"></i>)</a>
    </h6>
    {% for item in blogs limit:include.limit %}
        {% include widgets/blog_card.html item=item hide_bottom_border=forloop.last %}
    {% endfor %}
</div>
