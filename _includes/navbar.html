<nav class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand"><strong>{{site.data.profile.navbar_name}}</strong></a>
        <div class="d-flex align-items-center">
            <div class="theme-switcher mr-2" id="theme-switcher" role="radiogroup" aria-label="Color theme">
                <span class="theme-switcher__thumb" aria-hidden="true"></span>
                <button class="theme-switcher__option" type="button" role="radio" aria-checked="false" data-theme-mode="light" aria-label="Light theme" title="Light theme">
                    <i class="fas fa-sun" aria-hidden="true"></i>
                </button>
                <button class="theme-switcher__option" type="button" role="radio" aria-checked="false" data-theme-mode="dark" aria-label="Dark theme" title="Dark theme">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
                <button class="theme-switcher__option" type="button" role="radio" aria-checked="false" data-theme-mode="system" aria-label="Follow system theme" title="Follow system theme">
                    <i class="fas fa-gear" aria-hidden="true"></i>
                </button>
            </div>
            <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-map"></i> Menu
            </button>
        </div>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.name }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
